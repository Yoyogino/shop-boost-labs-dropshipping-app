# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "331bfe9fed8ecbac38ec0b0946cd5938"
name = "ShopBoost Dropshiping app"
application_url = "https://shop-boost-labs-dropshipping-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://shop-boost-labs-dropshipping-app.onrender.com/auth/callback",
  "https://shop-boost-labs-dropshipping-app.onrender.com/auth/shopify/callback",
  "https://shop-boost-labs-dropshipping-app.onrender.com/api/auth/callback"
]

[pos]
embedded = false
