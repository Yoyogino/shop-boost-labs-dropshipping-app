# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "331bfe9fed8ecbac38ec0b0946cd5938"
name = "ShopBoost Dropshiping app"
application_url = "https://shop-boost-labs-dropshipping-app.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # Mandatory GDPR compliance webhooks, added 2026-08-28 -- required before
  # App Store review. Corrected 2026-08-28: these are NOT regular
  # [[webhooks.subscriptions]] topics -- `shopify app deploy` rejected
  # "customers/data_request" etc. as invalid topics. Compliance webhooks use
  # their own dedicated config block with full absolute URLs instead. See
  # app/routes/webhooks.customers.data_request.jsx, webhooks.customers.redact.jsx,
  # and webhooks.shop.redact.jsx for the handlers.
  [webhooks.privacy_compliance]
  customer_data_request_url = "https://shop-boost-labs-dropshipping-app.onrender.com/webhooks/customers/data_request"
  customer_deletion_url = "https://shop-boost-labs-dropshipping-app.onrender.com/webhooks/customers/redact"
  shop_deletion_url = "https://shop-boost-labs-dropshipping-app.onrender.com/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://shop-boost-labs-dropshipping-app.onrender.com/auth/callback",
  "https://shop-boost-labs-dropshipping-app.onrender.com/auth/shopify/callback",
  "https://shop-boost-labs-dropshipping-app.onrender.com/api/auth/callback"
]

[pos]
embedded = false
